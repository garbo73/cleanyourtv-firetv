name: Build AFTSS CleanYourTV and Home Watcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download CleanYourTV
        run: git clone https://github.com/Gathin23/cleanyourtv.git

      - name: Build CleanYourTV
        working-directory: cleanyourtv/launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Download Home Watcher
        run: git clone https://github.com/NikhilSiddhu/firetv-tvos.git

      - name: Build Home Watcher
        working-directory: firetv-tvos/home-watcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Check and prepare APKs
        run: |
          mkdir -p dist
          test -f cleanyourtv/launcher/app/build/outputs/apk/release/app-release.apk
          test -f firetv-tvos/home-watcher/app/build/outputs/apk/release/app-release.apk
          cp cleanyourtv/launcher/app/build/outputs/apk/release/app-release.apk dist/CleanYourTV.apk
          cp firetv-tvos/home-watcher/app/build/outputs/apk/release/app-release.apk dist/HomeWatcher.apk
          ls -lh dist/

      - name: Publish both APKs
        uses: actions/upload-artifact@v4
        with:
          name: AFTSS-CleanYourTV-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
